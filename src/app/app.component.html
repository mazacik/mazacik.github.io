<div class="loading-overlay-bar" [style.backgroundColor]="getLoadingBarColor()"></div>
@if (applicationService.loading()) {
  <div class="loading-overlay-container anim-fade-in" animate.leave="anim-fade-out">
    <span class="loading-spinner"></span>
  </div>
}
<app-header [class.mobile-footer]="applicationService.mobileHeaderAtBottom" [inert]="applicationService.mobileSettingsOpen()"></app-header>
<div class="app-content center" [inert]="applicationService.mobileSettingsOpen()">
  <router-outlet></router-outlet>
</div>
