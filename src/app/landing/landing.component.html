@if (!checkingGoogleAuthentication && !googleAuthenticated) {
  <div class="sign-in-button" (click)="authenticationService.startAuthentication()">
    <img src="assets/google-logo.svg" />
    <span class="sign-in-text">Sign in with Google</span>
  </div>
}

@for (app of visibleApps; track app.id) {
  <span class="button fluid" (click)="navigate(app)">{{ app.label }}</span>
}
