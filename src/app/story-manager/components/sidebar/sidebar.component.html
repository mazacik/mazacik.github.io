<div class="sidebar-container">
  <div class="sidebar-header">
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="search-input" #searchInput (input)="onSearchInputChange(searchInput)" (focus)="searchInput.select()" placeholder="Search" />
    </div>
  </div>
  <div class="items-container y-scrollbar-container">
    <div class="tree-container">
      @for (article of stateService.getRoot(); track article.id) {
        <app-sidebar-row [article]="article"></app-sidebar-row>
      }
      <div
        class="root-drop-zone"
        [class.visible]="stateService.draggedArticle"
        [class.active]="stateService.dropPosition == 'root'"
        (dragover)="onRootDragOver($event)"
        (drop)="onRootDrop($event)">
        <span>Move to Root</span>
      </div>
    </div>
  </div>
  <div class="buttons-container">
    <div class="button smaller" (click)="stateService.create(null, false)">
      <span>Create Note</span>
    </div>
    <div class="button smaller" (click)="stateService.create(null, true)">
      <span>Create Folder</span>
    </div>
  </div>
</div>
