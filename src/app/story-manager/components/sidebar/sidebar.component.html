<div class="sidebar-container">
  <div class="sidebar-header">
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="search-input" aria-label="Search notes" #searchInput (input)="onSearchInputChange(searchInput)" (focus)="searchInput.select()" placeholder="Search" />
    </div>
  </div>
  <div class="items-container">
    <div class="notes-list">
      @for (article of visibleNotes; track article.id) {
        <app-sidebar-row [article]="article"></app-sidebar-row>
      }
    </div>
  </div>
  @if (stateService.draggedArticle) {
    <div class="root-drop-zone" [class.active]="stateService.dropPosition == 'root'" (dragover)="onRootDragOver($event)" (drop)="onRootDrop($event)">Move to end</div>
  }
  <div class="buttons-container">
    <button (click)="stateService.create(stateService.storyFolder, false)">Create Note</button>
  </div>
</div>
