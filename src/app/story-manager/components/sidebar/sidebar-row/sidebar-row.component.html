@if (article && !article.folder) {
  <div
    class="story-row"
    tabindex="0"
    role="button"
    [attr.aria-label]="article.title"
    (keydown.enter)="onClick()"
    (keydown.space)="$event.preventDefault(); onClick()"
    [class.current]="isCurrent()"
    [class.search-result]="isSearchResult()"
    [class.dragging]="isDraggingThis()"
    [class.drop-before]="isDropPosition('before')"
    [class.drop-after]="isDropPosition('after')"
    draggable="true"
    (click)="onClick()"
    (contextmenu)="openOptions($event)"
    (dragstart)="onDragStart($event)"
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
    (dragend)="onDragEnd($event)">
    <span class="title">{{ article.title }}</span>
  </div>
}
