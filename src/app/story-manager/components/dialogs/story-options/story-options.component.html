@if (inputs.article) {
  <button type="button" (click)="rename()">Rename {{ inputs.article.folder ? 'Folder' : 'Note' }}</button>
  <button type="button" (click)="delete()">Delete {{ inputs.article.folder ? 'Folder' : 'Note' }}</button>
}

@if (!inputs.article || inputs.article.folder) {
  <button type="button" (click)="create()">Create Note</button>
}
