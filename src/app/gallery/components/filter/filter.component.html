@let listTags = getListTags();
@let focusedTag = getFocusedTag(listTags);
<div class="filter-container">
  <div class="flex space-between align-items-center padding-2-l padding-1-r padding-half-v">
    <span class="filter-count">Filter • {{ filterService.images().length }}</span>
    <div class="filter-toggles flex center" role="group" aria-label="Image filters">
      <button type="button" class="filter-toggle hover-brighten" title="Favorites" aria-label="Favorites" (click)="toggleFilter(filterService.favoritesFilter)">
        <i class="fa-heart" [ngClass]="getFilterIconClass(filterService.favoritesFilter)" aria-hidden="true"></i>
      </button>
      <button type="button" class="filter-toggle hover-brighten" title="Bookmarks" aria-label="Bookmarks" (click)="toggleFilter(filterService.bookmarksFilter)">
        <i class="fa-bookmark" [ngClass]="getFilterIconClass(filterService.bookmarksFilter)" aria-hidden="true"></i>
      </button>
      <button type="button" class="filter-toggle hover-brighten" title="Groups" aria-label="Groups" (click)="toggleFilter(filterService.groupsFilter)">
        <i class="fa-object-group" [ngClass]="getFilterIconClass(filterService.groupsFilter)" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="h-separator margins"></div>
  @if (listMode) {
    <div class="search-input-container padding-2-h padding-1-v">
      <input
        #searchInput
        type="text"
        class="search-input"
        [value]="searchQuery"
        placeholder="Search"
        (input)="onSearchQueryInput($event)"
        (keydown)="onSearchKeydown($event)"
        role="combobox"
        aria-label="Search tag filters"
        aria-autocomplete="list"
        aria-controls="filter-list-results"
        aria-expanded="true"
        [attr.aria-activedescendant]="focusedTag ? 'filter-list-result-' + focusedTag.id : null" />
      @if (hasSearchQuery()) {
        <button type="button" class="clear-search-button fa-solid fa-times" title="Clear search" (click)="clearSearchQuery(searchInput)"></button>
      }
    </div>
    <div class="h-separator margins"></div>
  }
  <div #resultsContainer class="filters-container y-scrollbar-container">
    <div class="flex column margins-1-l margins-2-r padding-half-v">
      @if (listMode) {
        <div id="filter-list-results" role="listbox" aria-label="Tag filters">
          @for (tag of listTags; track tag.id) {
            <app-filter-row
              #listRow
              [id]="'filter-list-result-' + tag.id"
              role="option"
              [class.search-focused]="tag === focusedTag"
              [attr.aria-selected]="tag === focusedTag"
              [tag]="tag"
              [showFullName]="true"
              [flatMode]="true"
              (tagToggled)="onTagToggled($event)"></app-filter-row>
          }
        </div>
      } @else {
        @for (tag of tagService.getRootTags(); track tag.id) {
          <app-filter-row [tag]="tag"></app-filter-row>
        }
      }
    </div>
  </div>
  <div class="h-separator margins"></div>
  <div class="filter-actions sidebar-actions flex gap center padding-1" role="group" aria-label="Filter actions">
    <div class="flex gap">
      <button type="button" class="icon-button fa-solid fa-bars" title="List" aria-label="List" [class.active]="listMode" [attr.aria-pressed]="listMode" (click)="setFilterMode('list')"></button>
      <button
        type="button"
        class="icon-button fa-solid fa-folder-tree"
        title="Tree"
        aria-label="Tree"
        [class.active]="!listMode"
        [attr.aria-pressed]="!listMode"
        (click)="setFilterMode('tree')"></button>
      <div class="v-separator"></div>
    </div>
    <div class="flex gap">
      <button
        type="button"
        class="icon-button badged-action"
        title="Invert Tag Filters"
        aria-label="Invert Tag Filters"
        [class.active]="filterService.isTagFiltersInvert()"
        [attr.aria-pressed]="filterService.isTagFiltersInvert()"
        (click)="filterService.invertTagFilters()">
        <i class="fa-solid fa-filter" aria-hidden="true"></i>
        <i class="action-badge fa-solid fa-exclamation" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-button badged-action" title="Clear Tag Filters" aria-label="Clear Tag Filters" [disabled]="!canClear()" [class.disabled]="!canClear()" (click)="clearFilters()">
        <i class="fa-solid fa-filter" aria-hidden="true"></i>
        <i class="action-badge fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div class="flex gap">
      <div class="v-separator"></div>
      <button type="button" class="icon-button badged-action" title="Create Tag" aria-label="Create Tag" (click)="tagService.openTagCreate()">
        <i class="fa-solid fa-tag" aria-hidden="true"></i>
        <i class="action-badge fa-solid fa-plus" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-button badged-action" title="Create Tag Group" aria-label="Create Tag Group" (click)="tagService.openTagGroupCreate()">
        <i class="fa-solid fa-folder" aria-hidden="true"></i>
        <i class="action-badge fa-solid fa-plus" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
<div class="v-separator desktop-only"></div>
