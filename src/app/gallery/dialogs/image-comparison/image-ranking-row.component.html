<div class="active-image" role="group" aria-label="Unranked image">
  <app-image
    [src]="displayedImage.contentLink"
    [placeholderSrc]="galleryUtils.getPlaceholderSrc(displayedImage)"
    [sourceWidth]="displayedImage.imageMediaMetadata?.width || displayedImage.videoMediaMetadata?.width"
    [sourceHeight]="displayedImage.imageMediaMetadata?.height || displayedImage.videoMediaMetadata?.height"
    (click)="openFullscreen(displayedImage)"
    (contextmenu)="openFullscreen(displayedImage, $event)"></app-image>
  <div class="active-actions">
    <button type="button" class="icon-button fa-solid fa-rotate-left" title="Restart Image Placement" aria-label="Restart image placement" (click)="restart.emit($event)"></button>
    <button type="button" class="icon-button fa-solid fa-forward-step" title="Skip Image" aria-label="Skip image" (click)="skip.emit($event)"></button>
  </div>
  @if ((displayedImage.group?.images.length ?? 0) > 1) {
    <div class="group-navigation">
      <button type="button" class="icon-button fa-solid fa-chevron-left" title="Previous Group Image" aria-label="Previous group image" (click)="showGroupImage(-1)"></button>
      <button type="button" class="icon-button fa-solid fa-chevron-right" title="Next Group Image" aria-label="Next group image" (click)="showGroupImage(1)"></button>
    </div>
  }
  <button type="button" class="button placement-button" (click)="confirmPlacement($event)">Place here</button>
</div>
<div class="ranked-column">
  <div class="column-viewport">
    <div #rankedScroller class="ranked-scroller" tabindex="0" role="region" aria-label="Ranked images, highest ranked first. Scroll or use up and down arrows to select a placement."
      (keydown)="onKeydown($event)" (dragstart)="$event.preventDefault()">
      @for (subject of rankedSubjects; track subject.id) {
        <div class="insertion-gap" aria-hidden="true"></div>
        <button type="button" class="ranked-card" [style.aspect-ratio]="thumbnailAspectRatio(subject.image)" [attr.aria-label]="subject.image?.name ? 'Open ' + subject.image.name + ' fullscreen' : 'Open ranked image fullscreen'" (click)="openFullscreen(subject.image)" (contextmenu)="openFullscreen(subject.image, $event)">
          @if (subject.image) {
            <img [src]="subject.image.thumbnailLink || subject.image.contentLink" [style.height.%]="thumbnailAspectRatio(subject.image) ? 100 : null" alt="" loading="lazy" draggable="false" />
          } @else {
            <span class="missing-image">Image unavailable</span>
          }
        </button>
      }
      <div class="insertion-gap" aria-hidden="true"></div>
    </div>
    <div class="insertion-indicator" aria-hidden="true"></div>
  </div>
</div>
